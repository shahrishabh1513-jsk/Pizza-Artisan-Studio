<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Pizza Recipe · Bill</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/bill.css">
</head>
<body onload="loadBill()">

    <!-- LOADER -->
    <div id="loader" class="loader-container">
        <img src="img/chef.gif" alt="Chef preparing..." class="chef-loader">
        <div class="pizza-loader">
            <div class="loader-dough"></div>
            <div class="loader-sauce"></div>
            <div class="loader-cheese"></div>
        </div>
        <p class="loader-text">Calculating your pizza perfection...</p>
    </div>

    <!-- BILL CONTENT -->
    <div id="main" class="bill-container">
        
        <!-- Back to kitchen button -->
        <a href="index.html" class="back-to-kitchen">
            <i class="fas fa-arrow-left"></i> Back to Kitchen
        </a>
        
        <!-- Recipe Card -->
        <div class="bill-card">
            
            <!-- Header with animated pizza icon -->
            <div class="bill-header">
                <div class="bill-icon">
                    <i class="fas fa-pizza-slice"></i>
                </div>
                <h1>Your Pizza Recipe</h1>
                <p class="bill-subtitle">Here's what you've created</p>
            </div>
            
            <!-- Pizza Preview Mini -->
            <div class="pizza-preview-mini">
                <div class="mini-pizza">
                    <img src="img/base.png" alt="Base" class="mini-base">
                    <div id="mini-sauce" class="mini-sauce"></div>
                    <div id="mini-cheese" class="mini-cheese"></div>
                    <div class="mini-toppings" id="mini-toppings"></div>
                </div>
            </div>
            
            <!-- Ingredients List -->
            <div class="ingredients-bill">
                <div class="bill-section-title">
                    <i class="fas fa-utensils"></i> Ingredients
                </div>
                
                <!-- Base (always there) -->
                <div class="bill-item base-row">
                    <div class="item-name">
                        <span class="item-dot"></span>
                        Pizza Base
                    </div>
                    <div class="item-points">
                        <span class="points-badge">5 pts</span>
                    </div>
                </div>
                
                <!-- Dynamic ingredients will be inserted here -->
                <div id="bill-ingredients-list"></div>
                
                <!-- Separator -->
                <div class="bill-separator"></div>
                
                <!-- Total -->
                <div class="bill-total">
                    <div class="total-label">
                        <i class="fas fa-star"></i>
                        <span>Total Points</span>
                    </div>
                    <div class="total-value" id="totalPoints">0</div>
                </div>
                
                <!-- Pizza Rating -->
                <div class="pizza-rating">
                    <div class="rating-label">Pizza Quality</div>
                    <div class="rating-stars" id="ratingStars">
                        <!-- Stars generated by JS -->
                    </div>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="bill-actions">
                <button class="btn-print" onclick="printBill()">
                    <i class="fas fa-print"></i> Print Recipe
                </button>
                <button class="btn-new" onclick="window.location.href='index.html'">
                    <i class="fas fa-plus"></i> Create New
                </button>
            </div>
            
            <!-- Fun Fact -->
            <div class="bill-fun-fact" id="funFact">
                <i class="fas fa-lightbulb"></i>
                <span>Fun fact: Your pizza has 5 ingredients!</span>
            </div>
        </div>
    </div>

    <script src="js/billing.js"></script>
    <script>
        // Simple loader function
        function loadBill() {
            setTimeout(function() {
                document.getElementById("loader").style.display = "none";
                document.getElementById("main").style.display = "flex";
            }, 2000);
        }
    </script>
</body>
</html>
