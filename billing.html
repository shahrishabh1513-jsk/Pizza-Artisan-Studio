<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill · Pizza House</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/billing.css">
</head>
<body>

<div class="toast-stack" id="toastStack"></div>

<div class="app-shell narrow">
    <div class="topbar">
        <div class="logo"><span class="flame">🔥</span> Pizza House — Bill</div>
        <div class="stat-row">
            <a class="btn btn-ghost" href="index.html" style="padding:8px 16px;">← Menu</a>
        </div>
    </div>

    <div class="bill-card">
        <div class="bill-header">
            <div class="bill-icon">🍕</div>
            <h1>Order Complete!</h1>
            <p class="hint" id="billSubtitle"></p>
        </div>

        <div class="ticket" style="margin-bottom:22px;">
            <div class="ticket-title" id="billOrderTitle"></div>
            <div id="billLines"></div>
            <div class="ticket-divider"></div>
            <div class="ticket-row"><span>Subtotal</span><span id="billSubtotal"></span></div>
            <div class="ticket-row"><span>Tax (5%)</span><span id="billTax"></span></div>
            <div class="ticket-divider"></div>
            <div class="ticket-row" style="font-weight:700; font-size:1rem;"><span>TOTAL</span><span id="billTotal"></span></div>
        </div>

        <div class="rating-breakdown">
            <div class="rb-row"><span>Order Accuracy</span><div class="rb-track"><div class="rb-fill" id="rbAccuracy"></div></div><b id="rbAccuracyVal"></b></div>
            <div class="rb-row"><span>Baking</span><div class="rb-track"><div class="rb-fill" id="rbBake"></div></div><b id="rbBakeVal"></b></div>
            <div class="rb-row"><span>Packaging</span><div class="rb-track"><div class="rb-fill" id="rbPack"></div></div><b id="rbPackVal"></b></div>
            <div class="rb-row"><span>Delivery Speed</span><div class="rb-track"><div class="rb-fill" id="rbSpeed"></div></div><b id="rbSpeedVal"></b></div>
        </div>

        <div class="final-rating">
            <div class="stars" id="starsOut"></div>
            <div class="reward-grid">
                <div class="reward-chip">🏆 Score <b id="rewardScore"></b></div>
                <div class="reward-chip">💰 <b id="rewardMoney"></b></div>
                <div class="reward-chip">⭐ XP <b id="rewardXP"></b></div>
            </div>
        </div>

        <div class="order-actions" style="justify-content:center; margin-top:24px;">
            <button class="btn btn-ghost" id="btnPrintBill">🖨️ Print Bill</button>
            <button class="btn btn-primary" id="btnNextOrder">➡️ Next Order</button>
        </div>
    </div>
</div>

<script src="js/ingredients.js"></script>
<script src="js/storage.js"></script>
<script src="js/scoring.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/billing.js"></script>
</body>
</html>
