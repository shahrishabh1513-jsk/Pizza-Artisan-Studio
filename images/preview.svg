<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#170f1c"/>
      <stop offset="100%" stop-color="#2a1a33"/>
    </linearGradient>
    <radialGradient id="pcrust" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f3cf8e"/>
      <stop offset="60%" stop-color="#e3a857"/>
      <stop offset="100%" stop-color="#b9752c"/>
    </radialGradient>
    <style>
      .win { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.12); stroke-width:1.5; }
      .dot { fill:#5c4a55; }
      .label { font-family: Trebuchet MS, sans-serif; font-size:14px; fill:#ffb347; font-weight:700; }
      .sub { font-family: Trebuchet MS, sans-serif; font-size:10px; fill:#c9bfc2; }
      .pulse { animation: pulse 1.8s ease-in-out infinite; transform-origin:center; }
      .pulse.d2{animation-delay:.3s;} .pulse.d3{animation-delay:.6s;} .pulse.d4{animation-delay:.9s;}
      @keyframes pulse { 0%,100%{ transform:scale(1); opacity:1;} 50%{ transform:scale(1.25); opacity:.75;} }
      .bar-fill { animation: fill 3s ease-in-out infinite; }
      @keyframes fill { 0%{ width:6px;} 50%{ width:150px;} 100%{ width:6px;} }
      .flick { animation: flick 1s ease-in-out infinite; transform-origin: bottom center;}
      @keyframes flick { 0%,100%{transform:scaleY(1);} 50%{transform:scaleY(1.3);} }
      .starglow { animation: glow 1.6s ease-in-out infinite; }
      .starglow.d2{animation-delay:.15s;} .starglow.d3{animation-delay:.3s;} .starglow.d4{animation-delay:.45s;} .starglow.d5{animation-delay:.6s;}
      @keyframes glow { 0%,100%{ opacity:.55;} 50%{ opacity:1;} }
      .tline { fill:#e9dcc4; font-family: 'Courier New', monospace; font-size:11px; }
    </style>
  </defs>

  <rect width="960" height="420" fill="url(#pbg)"/>

  <!-- ===== Kitchen frame ===== -->
  <g transform="translate(24,24)">
    <rect class="win" x="0" y="0" width="280" height="372" rx="20"/>
    <circle class="dot" cx="20" cy="20" r="4"/><circle class="dot" cx="32" cy="20" r="4"/><circle class="dot" cx="44" cy="20" r="4"/>
    <text class="label" x="20" y="52">🍕 Kitchen</text>
    <text class="sub" x="20" y="68">size → dough → sauce → cheese → toppings</text>

    <circle cx="140" cy="185" r="80" fill="url(#pcrust)" stroke="#8a5423" stroke-width="3"/>
    <circle cx="140" cy="185" r="63" fill="#c1440e" opacity="0.75"/>
    <circle cx="140" cy="185" r="56" fill="#ffcf56" opacity="0.5"/>
    <circle class="pulse" cx="115" cy="160" r="9" fill="#c0392b"/>
    <circle class="pulse d2" cx="165" cy="168" r="9" fill="#c0392b"/>
    <circle class="pulse d3" cx="125" cy="205" r="9" fill="#c0392b"/>
    <circle class="pulse d4" cx="160" cy="210" r="9" fill="#c0392b"/>

    <g transform="translate(20,300)">
      <rect width="60" height="52" rx="10" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.1)"/>
      <rect x="70" width="60" height="52" rx="10" fill="rgba(255,122,61,.18)" stroke="#ff7a3d"/>
      <rect x="140" width="60" height="52" rx="10" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.1)"/>
      <rect x="210" width="60" height="52" rx="10" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.1)"/>
      <text x="30" y="32" text-anchor="middle" font-size="18">🍄</text>
      <text x="100" y="32" text-anchor="middle" font-size="18">🫑</text>
      <text x="170" y="32" text-anchor="middle" font-size="18">🧅</text>
      <text x="240" y="32" text-anchor="middle" font-size="18">🌿</text>
    </g>
  </g>

  <!-- ===== Oven frame ===== -->
  <g transform="translate(340,24)">
    <rect class="win" x="0" y="0" width="280" height="372" rx="20"/>
    <circle class="dot" cx="20" cy="20" r="4"/><circle class="dot" cx="32" cy="20" r="4"/><circle class="dot" cx="44" cy="20" r="4"/>
    <text class="label" x="20" y="52">🔥 Oven</text>
    <text class="sub" x="20" y="68">temperature · live bake timer</text>

    <rect x="30" y="90" width="220" height="170" rx="24" fill="#201207" stroke="#3d271a" stroke-width="6"/>
    <circle cx="140" cy="175" r="62" fill="url(#pcrust)"/>
    <path class="flick" d="M110 250 C 104 236, 114 232, 110 220 C 122 234, 118 244, 110 250 Z" fill="#ff7a3d"/>
    <path class="flick" d="M140 254 C 134 240, 144 236, 140 224 C 152 238, 148 248, 140 254 Z" fill="#ffb347" style="animation-delay:.3s"/>
    <path class="flick" d="M170 250 C 164 236, 174 232, 170 220 C 182 234, 178 244, 170 250 Z" fill="#ff7a3d" style="animation-delay:.6s"/>

    <text class="sub" x="20" y="288">Bake progress: 82% — Perfect</text>
    <rect x="20" y="296" width="240" height="10" rx="6" fill="rgba(0,0,0,.35)"/>
    <rect class="bar-fill" x="20" y="296" width="150" height="10" rx="6" fill="#ffb347"/>

    <rect x="20" y="326" width="115" height="34" rx="20" fill="rgba(255,122,61,.9)"/>
    <text x="77" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#241208">Take Out</text>
    <rect x="145" y="326" width="115" height="34" rx="20" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.15)"/>
    <text x="202" y="348" text-anchor="middle" font-size="12" fill="#f6ece0">220°C</text>
  </g>

  <!-- ===== Billing frame ===== -->
  <g transform="translate(656,24)">
    <rect class="win" x="0" y="0" width="280" height="372" rx="20"/>
    <circle class="dot" cx="20" cy="20" r="4"/><circle class="dot" cx="32" cy="20" r="4"/><circle class="dot" cx="44" cy="20" r="4"/>
    <text class="label" x="20" y="52">🧾 Billing</text>
    <text class="sub" x="20" y="68">itemised bill · rating · payout</text>

    <rect x="20" y="86" width="240" height="150" rx="10" fill="#f5e8cf"/>
    <text class="tline" x="34" y="108" fill="#2c1c14">ORDER #1042</text>
    <text class="tline" x="34" y="128" fill="#2c1c14">Large Farmhouse       ₹299</text>
    <text class="tline" x="34" y="146" fill="#2c1c14">Mushroom ×2            ₹40</text>
    <text class="tline" x="34" y="164" fill="#2c1c14">Bell Pepper ×2         ₹40</text>
    <text class="tline" x="34" y="188" fill="#2c1c14" font-weight="700">TOTAL                 ₹414</text>

    <g transform="translate(70,260)" font-size="26">
      <text class="starglow" x="0" y="0">⭐</text>
      <text class="starglow d2" x="30" y="0">⭐</text>
      <text class="starglow d3" x="60" y="0">⭐</text>
      <text class="starglow d4" x="90" y="0">⭐</text>
      <text class="starglow d5" x="120" y="0">⭐</text>
    </g>

    <rect x="20" y="300" width="115" height="40" rx="20" fill="rgba(0,0,0,.25)" stroke="rgba(255,255,255,.1)"/>
    <text x="77" y="325" text-anchor="middle" font-size="12" fill="#ffb347" font-weight="700">💰 ₹414</text>
    <rect x="145" y="300" width="115" height="40" rx="20" fill="rgba(0,0,0,.25)" stroke="rgba(255,255,255,.1)"/>
    <text x="202" y="325" text-anchor="middle" font-size="12" fill="#ffb347" font-weight="700">⭐ +120 XP</text>
  </g>
</svg>
