<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#170f1c"/>
      <stop offset="100%" stop-color="#2a1a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ff7a3d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crust" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f3cf8e"/>
      <stop offset="60%" stop-color="#e3a857"/>
      <stop offset="100%" stop-color="#b9752c"/>
    </radialGradient>
    <radialGradient id="sauce" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e0602c"/>
      <stop offset="100%" stop-color="#c1440e"/>
    </radialGradient>
    <radialGradient id="cheese" cx="40%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="100%" stop-color="#ffcf56"/>
    </radialGradient>
    <style>
      .pizza-spin { transform-origin: 960px 160px; animation: spin 14s linear infinite; }
      @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
      .float { animation: floatY 3s ease-in-out infinite; transform-origin: center; }
      @keyframes floatY { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }
      .flicker { animation: flick 1.1s ease-in-out infinite; transform-origin: bottom center; }
      .flicker.d2 { animation-delay: .3s; }
      .flicker.d3 { animation-delay: .6s; }
      @keyframes flick { 0%,100% { transform: scaleY(1) translateY(0); opacity:.9;} 50% { transform: scaleY(1.25) translateY(-4px); opacity:1;} }
      .steam { animation: rise 3.2s ease-in infinite; opacity:0; }
      .steam.d2 { animation-delay: 1s; }
      .steam.d3 { animation-delay: 2s; }
      @keyframes rise { 0% { opacity:0; transform: translateY(0) scale(.6);} 25%{opacity:.7;} 100% { opacity:0; transform: translateY(-60px) scale(1.3);} }
      .title-fade { animation: fadeIn 1s ease both; }
      @keyframes fadeIn { from {opacity:0; transform: translateY(10px);} to {opacity:1; transform: translateY(0);} }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- text -->
  <g class="title-fade">
    <text x="70" y="140" font-family="Georgia, 'Trebuchet MS', sans-serif" font-size="58" font-weight="700" fill="#f6ece0">🔥 PIZZA HOUSE</text>
    <text x="70" y="185" font-family="Trebuchet MS, sans-serif" font-size="24" fill="#ffb347">Pizza Chef Simulator</text>
    <text x="70" y="222" font-family="Trebuchet MS, sans-serif" font-size="15" fill="#c9bfc2">Take the order · Build it right · Bake it perfect · Deliver on time</text>
  </g>

  <!-- flames under the pizza -->
  <g transform="translate(880,255)">
    <path class="flicker" d="M0 0 C -8 -18, 6 -22, 0 -40 C 14 -22, 10 -10, 0 0 Z" fill="#ff7a3d"/>
    <path class="flicker d2" d="M40 4 C 32 -14, 46 -20, 40 -36 C 54 -18, 50 -6, 40 4 Z" fill="#ffb347"/>
    <path class="flicker d3" d="M80 0 C 72 -18, 86 -22, 80 -40 C 94 -22, 90 -10, 80 0 Z" fill="#ff7a3d"/>
  </g>

  <!-- steam -->
  <g fill="#ffffff">
    <ellipse class="steam" cx="930" cy="70" rx="6" ry="16"/>
    <ellipse class="steam d2" cx="960" cy="65" rx="6" ry="16"/>
    <ellipse class="steam d3" cx="990" cy="70" rx="6" ry="16"/>
  </g>

  <!-- pizza -->
  <g class="float">
    <g class="pizza-spin">
      <circle cx="960" cy="160" r="92" fill="url(#crust)" stroke="#8a5423" stroke-width="4"/>
      <circle cx="960" cy="160" r="74" fill="url(#sauce)" opacity="0.85"/>
      <circle cx="960" cy="160" r="66" fill="url(#cheese)" opacity="0.55"/>
      <circle cx="925" cy="130" r="11" fill="#c0392b"/>
      <circle cx="995" cy="140" r="11" fill="#c0392b"/>
      <circle cx="940" cy="185" r="11" fill="#c0392b"/>
      <circle cx="990" cy="190" r="11" fill="#c0392b"/>
      <circle cx="965" cy="150" r="11" fill="#c0392b"/>
      <circle cx="915" cy="170" r="7" fill="#2d3436"/>
      <circle cx="1000" cy="170" r="7" fill="#2d3436"/>
      <circle cx="955" cy="120" r="7" fill="#2d3436"/>
    </g>
  </g>
</svg>
