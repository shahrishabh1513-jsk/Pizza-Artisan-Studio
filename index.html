<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Artisan · Build Your Masterpiece</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body onload="initLoader()">

    <!-- LOADER -->
    <div id="loader" class="loader-container">
        <img src="./img/chef.png" alt="Chef preparing..." class="chef-loader">
        <div class="pizza-loader">
            <div class="loader-dough"></div>
            <div class="loader-sauce"></div>
            <div class="loader-cheese"></div>
        </div>
        <p class="loader-text">Kneading the dough...</p>
    </div>

    <!-- MAIN GAME -->
    <div id="main" class="game-container">
        
        <!-- Header with score -->
        <div class="game-header">
            <div class="logo">
                <i class="fas fa-pizza-slice"></i> Pizza Artisan
            </div>
            <div class="score-badge">
                <i class="fas fa-star"></i>
                <span id="pizzaPoints">0</span> pts
            </div>
        </div>

        <!-- Pizza Canvas -->
        <div class="pizza-studio">
            <div class="pizza-canvas">
                <img id="base" src="./img/base.png" alt="Pizza Base" class="pizza-base">
                
                <!-- Sauce Layer -->
                <div id="sauce-layer" class="topping-layer sauce-layer">
                    <div class="sauce-splash"></div>
                </div>
                
                <!-- Cheese Layer -->
                <div id="cheese-layer" class="topping-layer cheese-layer">
                    <div class="cheese-melt"></div>
                </div>
                
                <!-- Pepperoni -->
                <div id="pepperoni-layer" class="topping-layer">
                    <img src="./img/pepperoni.png" class="pepperoni-1 topping-item" alt="">
                    <img src="./img/pepperoni.png" class="pepperoni-2 topping-item" alt="">
                    <img src="./img/pepperoni.png" class="pepperoni-3 topping-item" alt="">
                    <img src="./img/pepperoni.png" class="pepperoni-4 topping-item" alt="">
                    <img src="./img/pepperoni.png" class="pepperoni-5 topping-item" alt="">
                    <img src="./img/pepperoni.png" class="pepperoni-6 topping-item" alt="">
                    <img src="./img/pepperoni.png" class="pepperoni-7 topping-item" alt="">
                    <img src="./img/pepperoni.png" class="pepperoni-8 topping-item" alt="">
                </div>
                
                <!-- Olives -->
                <div id="olives-layer" class="topping-layer">
                    <img src="./img/olives.png" class="olive-1 topping-item" alt="">
                    <img src="./img/olives.png" class="olive-2 topping-item" alt="">
                    <img src="./img/olives.png" class="olive-3 topping-item" alt="">
                    <img src="./img/olives.png" class="olive-4 topping-item" alt="">
                    <img src="./img/olives.png" class="olive-5 topping-item" alt="">
                    <img src="./img/olives.png" class="olive-6 topping-item" alt="">
                    <img src="./img/olives.png" class="olive-7 topping-item" alt="">
                    <img src="./img/olives.png" class="olive-8 topping-item" alt="">
                </div>

                <!-- Bell Peppers -->
                <div id="pepper-layer" class="topping-layer">
                    <img src="./img/bell-pepper.png" class="pepper-1 topping-item" alt="">
                    <img src="./img/bell-pepper.png" class="pepper-2 topping-item" alt="">
                    <img src="./img/bell-pepper.png" class="pepper-3 topping-item" alt="">
                    <img src="./img/bell-pepper.png" class="pepper-4 topping-item" alt="">
                </div>
                
                <!-- Onions -->
                <div id="onion-layer" class="topping-layer">
                    <img src="./img/onion.png" class="onion-1 topping-item" alt="">
                    <img src="./img/onion.png" class="onion-2 topping-item" alt="">
                    <img src="./img/onion.png" class="onion-3 topping-item" alt="">
                    <img src="./img/onion.png" class="onion-4 topping-item" alt="">
                </div>
                
                <!-- Basil -->
                <div id="basil-layer" class="topping-layer">
                    <img src="./img/basil.png" class="basil-1 topping-item" alt="">
                    <img src="./img/basil.png" class="basil-2 topping-item" alt="">
                    <img src="./img/basil.png" class="basil-3 topping-item" alt="">
                    <img src="./img/basil.png" class="basil-4 topping-item" alt="">
                </div>
                
                <!-- Tomato -->
                <div id="tomato-layer" class="topping-layer">
                    <img src="./img/tomato.png" class="tomato-1 topping-item" alt="">
                    <img src="./img/tomato.png" class="tomato-2 topping-item" alt="">
                    <img src="./img/tomato.png" class="tomato-3 topping-item" alt="">
                    <img src="./img/tomato.png" class="tomato-4 topping-item" alt="">
                </div>
            </div>
        </div>

        <!-- Ingredients Panel -->
        <div class="ingredients-panel">
            <div class="panel-header">
                <h3><i class="fas fa-utensils"></i> Add Ingredients</h3>
                <p class="ingredients-hint">Click to add • Each adds +2 pts</p>
            </div>
            
            <div class="ingredients-grid">
                <!-- Base (always included) -->
                <div class="ingredient-item base-item disabled">
                    <div class="ingredient-icon"><i class="fas fa-circle"></i></div>
                    <span>Pizza Base</span>
                    <span class="ingredient-price">5 pts</span>
                </div>
                
                <!-- Sauce -->
                <div class="ingredient-item" onclick="toggleIngredient('sauce')" id="ing-sauce">
                    <div class="ingredient-icon sauce-icon"><i class="fas fa-tint"></i></div>
                    <span>Sauce</span>
                    <span class="ingredient-price">+2</span>
                </div>
                
                <!-- Cheese -->
                <div class="ingredient-item" onclick="toggleIngredient('cheese')" id="ing-cheese">
                    <div class="ingredient-icon cheese-icon"><i class="fas fa-cheese"></i></div>
                    <span>Cheese</span>
                    <span class="ingredient-price">+2</span>
                </div>
                
                <!-- Pepperoni -->
                <div class="ingredient-item" onclick="toggleIngredient('pepperoni')" id="ing-pepperoni">
                    <div class="ingredient-icon pepperoni-icon"><i class="fas fa-bacon"></i></div>
                    <span>Pepperoni</span>
                    <span class="ingredient-price">+2</span>
                </div>
                
                <!-- Olives -->
                <div class="ingredient-item" onclick="toggleIngredient('olives')" id="ing-olives">
                    <div class="ingredient-icon olives-icon"><i class="fas fa-circle"></i></div>
                    <span>Olives</span>
                    <span class="ingredient-price">+2</span>
                </div>
                
                <!-- Bell Pepper -->
                <div class="ingredient-item" onclick="toggleIngredient('pepper')" id="ing-pepper">
                    <div class="ingredient-icon pepper-icon"><i class="fas fa-pepper"></i></div>
                    <span>Bell Pepper</span>
                    <span class="ingredient-price">+2</span>
                </div>
                
                <!-- Onion -->
                <div class="ingredient-item" onclick="toggleIngredient('onion')" id="ing-onion">
                    <div class="ingredient-icon onion-icon"><i class="fas fa-onion"></i></div>
                    <span>Onion</span>
                    <span class="ingredient-price">+2</span>
                </div>
                
                <!-- Basil -->
                <div class="ingredient-item" onclick="toggleIngredient('basil')" id="ing-basil">
                    <div class="ingredient-icon basil-icon"><i class="fas fa-leaf"></i></div>
                    <span>Basil</span>
                    <span class="ingredient-price">+2</span>
                </div>
                
                <!-- Tomato -->
                <div class="ingredient-item" onclick="toggleIngredient('tomato')" id="ing-tomato">
                    <div class="ingredient-icon tomato-icon"><i class="fas fa-apple-alt"></i></div>
                    <span>Tomato</span>
                    <span class="ingredient-price">+2</span>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn-reset" onclick="resetPizza()">
                    <i class="fas fa-redo-alt"></i> Reset
                </button>
                <button class="btn-next" onclick="goToBilling()">
                    <span>Review Pizza</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ingredients.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
