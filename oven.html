<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oven · Pizza House</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/oven.css">
</head>
<body>

<div class="toast-stack" id="toastStack"></div>

<div class="app-shell" id="ovenRoom">
    <div class="topbar">
        <div class="logo"><span class="flame">🔥</span> Pizza House — Oven</div>
        <div class="stat-row">
            <a class="btn btn-ghost" href="index.html" style="padding:8px 16px;">← Menu</a>
        </div>
    </div>

    <div class="oven-grid">
        <div class="panel oven-visual-panel">
            <div class="oven-box" id="ovenBox">
                <div class="oven-fire">🔥🔥🔥</div>
                <div class="oven-mouth">
                    <div class="oven-pizza steam-wrap" id="ovenPizza">
                        <div class="steam" style="left:30%; animation-delay:0s;"></div>
                        <div class="steam" style="left:55%; animation-delay:.6s;"></div>
                        <div class="steam" style="left:70%; animation-delay:1.1s;"></div>
                    </div>
                </div>
            </div>
            <div class="temp-readout">🌡️ <span id="tempReadout">--</span>°C</div>
        </div>

        <div class="panel oven-controls-panel">
            <h2>🔥 Bake the Pizza</h2>
            <p class="hint">Ideal oven temperature for this order: <b id="idealTemp"></b>°C</p>

            <div class="temp-row" id="tempRow"></div>

            <div class="order-actions" style="margin-top:18px;">
                <button class="btn btn-primary" id="btnStartBake">▶️ Start Baking</button>
                <button class="btn btn-danger" id="btnTakeOut" disabled>🍕 Take Pizza Out!</button>
            </div>

            <div class="bake-progress" style="margin-top:22px;">
                <div class="helper-text">Bake progress: <b id="progressLabel">0%</b> — <span id="bakeWord">Not started</span></div>
                <div class="meter-track"><div class="meter-fill" id="bakeFill" style="width:0%"></div></div>
                <div class="helper-text" id="timerText" style="margin-top:8px;">⏱ 00:00</div>
            </div>

            <div id="resultBox" style="display:none; margin-top:22px;">
                <h3 id="resultTitle"></h3>
                <p class="helper-text" id="resultSub"></p>
                <button class="btn btn-primary" id="btnToCutting">🔪 Continue to Cutting</button>
            </div>
        </div>
    </div>
</div>

<script src="js/ingredients.js"></script>
<script src="js/storage.js"></script>
<script src="js/scoring.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/oven.js"></script>
</body>
</html>
